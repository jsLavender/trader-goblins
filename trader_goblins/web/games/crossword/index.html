<!DOCTYPE html>
<html>
<head lang="en">
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="HandheldFriendly" content="True">
    <title>Crossword puzzle player</title>
    <link href="css/player.css" rel="stylesheet">

    <!-- Trader Goblins arcade: storage isolation (first) + achievements -->
    <script src="/games/_shared/tg-namespace.js"></script>
    <link rel="stylesheet" href="/games/_shared/tg-arcade.css">
    <script defer src="/games/_shared/tg-arcade.js"></script>

    <!-- the main crossword JavaScript -->
    <script src="js/crosswords.js"></script>

    <!-- jQuery -->
    <script src="js/jquery.js"></script>

    <!-- for loading crosswords -->
    <!-- via local bundle -->

    <!-- for dark mode -->
    <script src="js/darkreader.js"></script>

    <style>
        html, body {
            /* height: 100%; */
            margin: 0;
            background-color: white;
        }
        div.crossword { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="crossword"></div>

<script>
    (function(){
        // Grab puzzle from query string if available
        var url = new URL(window.location.href);
        var puzzle = url.searchParams.get("file");
        if (!puzzle) puzzle = url.searchParams.get("puzzle");
        var params = {};
        if (puzzle) {
            params = {
                puzzle_file: {
                    url: puzzle,
                    type: puzzle.slice(puzzle.lastIndexOf('.') + 1)
                }
            };
        }
        CrosswordNexus.createCrossword($('div.crossword'), params);
    })();
</script>

<a class="tg-tip" href="https://paypal.me/johnlavender87" target="_blank" rel="noopener" title="Enjoying the games? Buy the dev a coffee"><i>☕</i><span>tip</span></a>
<style>
.tg-tip{position:fixed;top:8px;right:10px;z-index:9998;display:flex;align-items:center;gap:4px;
 padding:3px 10px;border-radius:999px;border:1px solid rgba(128,128,128,.35);
 background:rgba(128,128,128,.12);backdrop-filter:blur(4px);
 font:600 12px system-ui,sans-serif;line-height:1;text-decoration:none;color:inherit;opacity:.65;transition:opacity .15s}
.tg-tip:hover{opacity:1}
.tg-tip i{font-style:normal;font-size:14px;display:inline-block;transform-origin:50% 90%;animation:tgtipbob 2.8s ease-in-out infinite}
@keyframes tgtipbob{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
</style>
</body>
