<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Board of Seven</title>
<style>
 :root{--bg:#faf9f5;--surface:#fff;--line:#e9e7df;--ink:#1f1e1b;--muted:#6b6a64;
  --pos:#1a7f4b;--neg:#c0392b;--accent:#534AB7;--chip:#f1efe8;}
 @media (prefers-color-scheme: dark){:root{--bg:#161513;--surface:#201f1c;--line:#33322d;
  --ink:#e8e6df;--muted:#98968e;--pos:#4caf82;--neg:#e07856;--accent:#8f86e8;--chip:#2a2926;}}
 body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 "Segoe UI",-apple-system,sans-serif;}
 .wrap{max-width:960px;margin:0 auto;padding:28px 18px 60px;}
 h1{font-size:26px;margin:0 0 2px}
 .sub{color:var(--muted);margin:0 0 22px;font-size:13px}
 h2{font-size:17px;margin:26px 0 10px}
 table{border-collapse:collapse;width:100%;background:var(--surface);
  border:1px solid var(--line);border-radius:6px;font-size:13.5px}
 th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
 td{padding:7px 10px;border-bottom:1px solid var(--line);
  font-variant-numeric:tabular-nums}
 tr:last-child td{border-bottom:none}
 .num{text-align:right;font-family:Consolas,ui-monospace,monospace}
 .pos{color:var(--pos)}.neg{color:var(--neg)}
 .badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--chip);
  border:1px solid var(--line)}
 .badge.susp{color:var(--neg);border-color:var(--neg)}
 .badge.vote{color:var(--pos);border-color:var(--pos)}
 .method{color:var(--muted);font-size:12px}
 .scroll{overflow-x:auto}
</style></head><body><div class="wrap">
<h1>The Board of Seven</h1>
<p class="sub" id="asof"></p>
<p class="method" id="integrity"></p>
<h2>Standings <span class="method">(rolling last 40 settlements; weight is brier-anchored; pushes at &lt;0.25pp)</span></h2>
<div class="scroll"><table id="standings"><thead><tr>
 <th>Seat</th><th>Method</th><th class="num">n</th><th class="num">Hit%</th>
 <th class="num">ex21 pp</th><th class="num">Brier</th><th class="num">Weight</th><th>Status</th>
</tr></thead><tbody></tbody></table></div>
<p class="method" id="shadow"></p>
<h2>Open book</h2>
<div class="scroll"><table id="book"><thead><tr>
 <th>Seat</th><th>Ticker</th><th>Dir</th><th>Due</th><th class="num">Conf</th><th>Thesis</th>
</tr></thead><tbody></tbody></table></div>
<h2>Recent settlements</h2>
<div class="scroll"><table id="recent"><thead><tr>
 <th>Seat</th><th>Ticker</th><th>Dir</th><th>Window</th><th class="num">Signed excess</th><th>Result</th>
</tr></thead><tbody></tbody></table></div>
</div><script>
const D = {"as_of": "2026-09-08", "standings": [{"seat": "BoardSeat-Filings", "display": "Snagbur", "epithet": "the Archive-Delver", "duty": "Filings", "method": "SEC EDGAR only: annual XBRL trajectory + recent filing cadence", "horizon_days": 30, "n": 0, "hit_rate": null, "brier": null, "ex21": null, "pushes": 0, "mag_ok_rate": null, "last_deadline": null, "abstains": 18, "weight": 0.25, "suspended": false, "rusty": false, "unproven": true}, {"seat": "BoardSeat-Value", "display": "Zagrat", "epithet": "the Appraiser", "duty": "Value", "method": "EDGAR point-in-time valuation levels: what is cheap, not what changed", "horizon_days": 60, "n": 0, "hit_rate": null, "brier": null, "ex21": null, "pushes": 0, "mag_ok_rate": null, "last_deadline": null, "abstains": 12, "weight": 0.25, "suspended": false, "rusty": false, "unproven": true}, {"seat": "BoardSeat-Tape", "display": "Ghashruk", "epithet": "the Tapewatcher", "duty": "Tape", "method": "price/volume only: blended momentum, trend quality, RSI extremes as fade filter", "horizon_days": 21, "n": 0, "hit_rate": null, "brier": null, "ex21": null, "pushes": 0, "mag_ok_rate": null, "last_deadline": null, "abstains": 14, "weight": 0.25, "suspended": false, "rusty": false, "unproven": true}, {"seat": "BoardSeat-Surface", "display": "Volgash", "epithet": "the Skew-Eyed", "duty": "Surface", "method": "options surface only: IV rank + skew off the house chain log (SPY/QQQ/IWM)", "horizon_days": 21, "n": 0, "hit_rate": null, "brier": null, "ex21": null, "pushes": 0, "mag_ok_rate": null, "last_deadline": null, "abstains": 7, "weight": 0.25, "suspended": false, "rusty": false, "unproven": true}, {"seat": "BoardSeat-Regime", "display": "Grimbolg", "epithet": "the Weather-Eye", "duty": "Regime", "method": "market-wide only: SPY vs 200d, watchlist breadth, VIX rank; rules on risk itself", "horizon_days": 10, "n": 0, "hit_rate": null, "brier": null, "ex21": null, "pushes": 0, "mag_ok_rate": null, "last_deadline": null, "abstains": 0, "weight": 0.25, "suspended": false, "rusty": false, "unproven": true}, {"seat": "BoardSeat-Catalyst", "display": "Sharzuk", "epithet": "the Wire-Ear", "duty": "Catalyst", "method": "sniper headline events + earnings proximity; decays in days, not months", "horizon_days": 5, "n": 0, "hit_rate": null, "brier": null, "ex21": null, "pushes": 0, "mag_ok_rate": null, "last_deadline": null, "abstains": 74, "weight": 0.25, "suspended": false, "rusty": false, "unproven": true}, {"seat": "BoardSeat-Control", "display": "Uftak", "epithet": "the Blindfolded", "duty": "Control", "method": "seeded darts on the same watchlist -- the null hypothesis in a nice chair", "horizon_days": 21, "n": 0, "hit_rate": null, "brier": null, "ex21": null, "pushes": 0, "mag_ok_rate": null, "last_deadline": null, "abstains": 0, "weight": 0.25, "suspended": false, "rusty": false, "unproven": true}], "open_book": [], "generated_at": "2026-09-08T16:05:03.596338+00:00", "last_meeting": "2026-09-07", "recent": [], "always_long": {"n": 0, "hit_rate": null, "ex21": null}, "push_pp": 0.25, "legacy": {"forecasts": 196, "grades": 109}};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f = (x, d=2) => x == null ? "--" : Number(x).toFixed(d);
const seat = s => esc(String(s).replace("BoardSeat-", ""));
document.getElementById("asof").textContent =
  "Wall rebuilt " + D.as_of + "; last meeting " + (D.last_meeting || "not recorded") +
  " -- every opinion a dated IOU graded vs real SPY";
document.getElementById("integrity").textContent =
  `Returns include cash dividends and splits, using fixed call snapshots and completed market sessions. ${D.legacy.forecasts} legacy IOUs (${D.legacy.grades} grades) are preserved but excluded because their price basis is unverified. This starts a new record; it does not validate the old scores.`;
document.querySelector("#standings tbody").innerHTML = D.standings.map(s => {
  const status = s.suspended ? '<span class="badge susp">SUSPENDED</span>'
    : s.rusty ? '<span class="badge">rusty</span>'
    : s.unproven ? '<span class="badge">unproven</span>'
    : '<span class="badge vote">voting</span>';
  return `<tr><td><strong>${esc(s.display)}</strong> <span class="method">${esc(s.epithet)}</span><br>
   <span class="method">${esc(s.duty)} desk</span></td><td class="method">${esc(s.method)}</td>
   <td class="num">${s.n}</td><td class="num">${s.hit_rate==null?"--":f(s.hit_rate*100,0)}</td>
   <td class="num ${s.ex21>0?"pos":s.ex21<0?"neg":""}">${f(s.ex21)}</td>
   <td class="num">${f(s.brier,3)}</td><td class="num">${f(s.weight)}</td><td>${status}</td></tr>`;
}).join("");
const al = D.always_long;
document.getElementById("shadow").textContent = al.n
  ? `beta shadow (always-long on the Control's windows): hit ${f(al.hit_rate == null ? null : al.hit_rate*100,0)}%, ex21 ${f(al.ex21)}pp over ${al.n} windows`
  : "beta shadow appears once the Control has settled windows.";
document.querySelector("#book tbody").innerHTML = D.open_book.map(x =>
  `<tr><td>${seat(x.seat)}</td><td>${esc(x.ticker)}</td>
   <td class="${x.direction>0?"pos":"neg"}">${x.direction>0?"LONG":"SHORT"}</td>
   <td>${esc(x.deadline)}</td><td class="num">${f(x.confidence)}</td>
   <td class="method">${esc(x.thesis)}</td></tr>`).join("")
  || '<tr><td colspan="6" class="method">no live IOUs</td></tr>';
document.querySelector("#recent tbody").innerHTML = D.recent.map(g => {
  const push = Math.abs(g.excess_pct) < D.push_pp;
  const res = push ? "push" : (g.hit ? "hit" : "miss");
  return `<tr><td>${seat(g.seat)}</td><td>${esc(g.ticker)}</td>
   <td>${g.direction>0?"+":"-"}</td><td>${esc(g.as_of_date)} → ${esc(g.deadline)}</td>
   <td class="num ${g.signed_excess_pct>0?"pos":"neg"}">${f(g.signed_excess_pct)}pp</td>
   <td>${res}</td></tr>`;
}).join("") || '<tr><td colspan="6" class="method">nothing settled yet</td></tr>';
</script></body></html>
