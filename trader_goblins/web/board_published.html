  " -- every opinion a dated IOU graded vs real SPY";
document.getElementById("integrity").textContent =
  `Returns include cash dividends and splits, using fixed call snapshots and completed market sessions. ${D.legacy.forecasts} legacy IOUs (${D.legacy.grades} grades) are preserved but excluded because their price basis is unverified. This starts a new record; it does not validate the old scores.`;
document.querySelector("#standings tbody").innerHTML = D.standings.map(s => {
  const status = s.suspended ? '<span class="badge susp">SUSPENDED</span>'
    : s.rusty ? '<span class="badge">rusty</span>'
    : s.unproven ? '<span class="badge">unproven</span>'
    : '<span class="badge vote">voting</span>';
  return `<tr><td><strong>${esc(s.display)}</strong> <span class="method">${esc(s.epithet)}</span><br>
   <span class="method">${esc(s.duty)} desk</span></td><td class="method">${esc(s.method)}</td>
   <td class="num">${s.n}</td><td class="num">${s.hit_rate==null?"--":f(s.hit_rate*100,0)}</td>
   <td class="num ${s.ex21>0?"pos":s.ex21<0?"neg":""}">${f(s.ex21)}</td>
   <td class="num">${f(s.brier,3)}</td><td class="num">${f(s.weight)}</td><td>${status}</td></tr>`;
}).join("");
const al = D.always_long;
document.getElementById("shadow").textContent = al.n
  ? `beta shadow (always-long on the Control's windows): hit ${f(al.hit_rate == null ? null : al.hit_rate*100,0)}%, ex21 ${f(al.ex21)}pp over ${al.n} windows`
  : "beta shadow appears once the Control has settled windows.";
document.querySelector("#book tbody").innerHTML = D.open_book.map(x =>
  `<tr><td>${seat(x.seat)}</td><td>${esc(x.ticker)}</td>
   <td class="${x.direction>0?"pos":"neg"}">${x.direction>0?"LONG":"SHORT"}</td>
   <td>${esc(x.deadline)}</td><td class="num">${f(x.confidence)}</td>
   <td class="method">${esc(x.thesis)}</td></tr>`).join("")
  || '<tr><td colspan="6" class="method">no live IOUs</td></tr>';
document.querySelector("#recent tbody").innerHTML = D.recent.map(g => {
  const push = Math.abs(g.excess_pct) < D.push_pp;
  const res = push ? "push" : (g.hit ? "hit" : "miss");
  return `<tr><td>${seat(g.seat)}</td><td>${esc(g.ticker)}</td>
   <td>${g.direction>0?"+":"-"}</td><td>${esc(g.as_of_date)} → ${esc(g.deadline)}</td>
   <td class="num ${g.signed_excess_pct>0?"pos":"neg"}">${f(g.signed_excess_pct)}pp</td>
   <td>${res}</td></tr>`;
}).join("") || '<tr><td colspan="6" class="method">nothing settled yet</td></tr>';
</script></body></html>
